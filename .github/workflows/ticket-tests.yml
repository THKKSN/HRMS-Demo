name: Ticket Tests

on:
  push:
    paths:
      - 'apps/api/**'
      - 'apps/liff-web/**'
      - 'packages/shared-types/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/liff-web/**'
      - 'packages/shared-types/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'pnpm-lock.yaml'

jobs:
  ticket-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: dotnet test apps/api/Hrms.Application.Tests/Hrms.Application.Tests.csproj
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
